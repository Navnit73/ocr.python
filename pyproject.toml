[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-advance"
version = "0.1.0"
description = "Production-ready AI PDF & Image OCR Platform using FastAPI, MongoDB, Cloudinary, and Pluggable AI"
authors = [{ name = "AI OCR Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "redis>=5.2.0",
    "cloudinary>=1.41.0",
    "celery>=5.4.0",
    "python-multipart>=0.0.18",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.0.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.26.0",
    "mongomock-motor>=0.0.33",
    "black>=24.10.0",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
