version: "3.8"

services:
  # OCR FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr_advance_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - MONGODB_ENABLED=true
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ocr_advance
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MongoDB Document Persistence
  mongodb:
    image: mongo:7.0
    container_name: ocr_advance_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ocr_advance
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
