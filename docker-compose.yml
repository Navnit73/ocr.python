version: "3.8"

services:
  # OCR FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr_advance_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - MONGODB_ENABLED=true
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ocr_advance
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=false
      - STORAGE_DIR=/app/storage/uploads
    volumes:
      - app_storage:/app/storage/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Celery OCR Background Worker (Optional distributed execution)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr_advance_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - MONGODB_ENABLED=true
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ocr_advance
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
      - STORAGE_DIR=/app/storage/uploads
    volumes:
      - app_storage:/app/storage/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Redis Message Broker & Cache
  redis:
    image: redis:7.2-alpine
    container_name: ocr_advance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MongoDB Document Persistence
  mongodb:
    image: mongo:7.0
    container_name: ocr_advance_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ocr_advance
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
